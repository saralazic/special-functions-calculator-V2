<div class="content" role="main">

  <div class="highlight-card">
    <app-svg-icon id="rocket" iconName="function-svgrepo-com"></app-svg-icon>
    <span><h2>{{head_1}}</h2></span>
  </div>

  <h1 class="subtitle">{{head_2}}</h1>

  <div class="card-grid">
    <a
      *ngFor="let fn of functions; let i = index"
      class="card"
      [href]="'/special-function/' + fn.route"
      [style.animation-delay]="(i * 60) + 'ms'"
    >
      <span class="card-symbol">{{fn.symbol}}</span>
      <span class="card-label">{{fn.label}}</span>
      <svg class="card-arrow" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

</div>
