<div class="chatbot-wrapper">
  <div class="chat-container">
    <div class="chat-header">
      <div class="header-icon">
        <mat-icon>smart_toy</mat-icon>
      </div>
      <div class="header-text">
        <h1>{{ title }}</h1>
        <p class="subtitle">{{ subtitle }}</p>
      </div>
    </div>

    <div class="messages-area" #messagesContainer>
      <div *ngIf="messages.length === 0" class="welcome-state">
        <div class="welcome-icon">
          <mat-icon>chat_bubble_outline</mat-icon>
        </div>
        <p class="welcome-text">{{ welcomeMessage }}</p>
        <p class="welcome-hint">{{ welcomeHint }}</p>

        <div class="suggestion-chips">
          <button class="chip" (click)="inputText = 'What is the Gamma function?'; sendMessage()">
            What is Gamma?
          </button>
          <button class="chip" (click)="inputText = 'Tell me about Bessel functions'; sendMessage()">
            Bessel functions
          </button>
          <button class="chip" (click)="inputText = 'Explain the Beta function'; sendMessage()">
            Beta function
          </button>
          <button class="chip" (click)="inputText = 'Hello!'; sendMessage()">
            Say hello
          </button>
        </div>
      </div>

      <div *ngFor="let msg of messages" class="message-row" [ngClass]="msg.role">
        <div class="avatar" *ngIf="msg.role === 'assistant'">
          <mat-icon>smart_toy</mat-icon>
        </div>
        <div class="bubble" [ngClass]="msg.role"
             *ngIf="msg.role === 'user'">
          {{ msg.content }}
        </div>
        <div class="bubble markdown-body" [ngClass]="msg.role"
             *ngIf="msg.role === 'assistant'"
             [innerHTML]="msg.content | markdown">
        </div>
        <div class="avatar user-avatar" *ngIf="msg.role === 'user'">
          <mat-icon>person</mat-icon>
        </div>
      </div>

      <div *ngIf="isLoading" class="message-row assistant">
        <div class="avatar">
          <mat-icon>smart_toy</mat-icon>
        </div>
        <div class="bubble assistant typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-container">
        <input
          #messageInput
          type="text"
          [(ngModel)]="inputText"
          (keydown)="onKeyDown($event)"
          [placeholder]="placeholder || 'Type a message...'"
          [disabled]="isLoading"
          autocomplete="off"
        />
        <button
          class="send-button"
          (click)="sendMessage()"
          [disabled]="!inputText.trim() || isLoading"
        >
          <mat-icon>send</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
